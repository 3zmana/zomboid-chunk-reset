# ZomboidChunkReset - user interface strings (English, default language).
#
# To add a language: copy this file to messages_<code>.properties (UTF-8), for example
# messages_de.properties, translate the values (not the keys) and set language.name.
# Put it in the "languages" folder of the settings folder (Language > Add a language… shows where).
# Placeholders {0}, {1}... are replaced as-is; apostrophes need no escaping.
# A missing string falls back to English.


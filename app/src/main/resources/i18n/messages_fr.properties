# Help
help.controls.title=Commandes
help.controls.header=Souris et clavier
help.controls.text=Clic gauche ou glisser : sélectionner des chunks (rectangle).\nMaj + clic gauche ou glisser : désélectionner.\nCtrl + clic gauche ou glisser (Cmd sur macOS) : cellules entières (32 × 32 chunks).\nClic droit ou molette enfoncée, glisser : déplacer la carte.\nMolette : zoomer autour du curseur.\nÉchap pendant un glisser : annuler le rectangle.\n\nCtrl+Z / Ctrl+Y : annuler / rétablir la sélection.\nCtrl+A : tout sélectionner · Ctrl+I : inverser · Ctrl+D : effacer.\nCtrl+R : sélectionner par coordonnées · Ctrl+G : aller aux coordonnées.\nCtrl+0 : ajuster la sauvegarde · Ctrl+= / Ctrl+- : zoom.\nCtrl+Maj+I / Ctrl+Maj+E : importer / exporter une sélection.\nCtrl+T : afficher ou masquer le terrain et les toits.


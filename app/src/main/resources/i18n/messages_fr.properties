language.add.text=Les fichiers de langue sont des fichiers texte nommés messages_<code>.properties (par exemple messages_de.properties pour l'allemand), en UTF-8. Placez-les dans ce dossier :\n\n{0}\n\nPartez du fichier anglais (bouton ci-dessous), traduisez les valeurs après les signes « = », indiquez dans language.name le nom de la langue dans cette langue, puis redémarrez le programme : la langue apparaît dans le menu Langue. Les textes manquants s'affichent en anglais.

# Help
help.controls.title=Controls
help.controls.header=Mouse and keyboard
help.controls.text=Left click or drag: select chunks (rectangle).\nShift + left click or drag: deselect.\nCtrl + left click or drag (Cmd on macOS): whole cells (32 × 32 chunks).\nRight or middle drag: move the map.\nMouse wheel: zoom around the cursor.\nEscape while dragging: cancel the rectangle.\n\nCtrl+Z / Ctrl+Y: undo / redo the selection.\nCtrl+A: select all chunks · Ctrl+I: invert · Ctrl+D: clear.\nCtrl+R: select by coordinates · Ctrl+G: go to coordinates.\nCtrl+0: fit the save · Ctrl+= / Ctrl+-: zoom.\nCtrl+Shift+I / Ctrl+Shift+E: import / export a selection.\nCtrl+T: show or hide terrain and roofs.

